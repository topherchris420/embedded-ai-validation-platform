[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eaiv"
version = "0.3.0"
description = "Embedded AI Validation Platform: firmware tests, TinyML benchmarks, sensor-fusion experiments, RT validation."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "topherchris420", email = "topherchris420@example.com" },
]
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pyelftools>=0.29",
    "rich>=13.5",
    "click>=8.1",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-asyncio",
    "ruff>=0.4.0",
    "mypy>=1.8",
    "black>=24.0",
    "pre-commit",
]
# Hardware debugging
jlink = ["pylink-square>=0.13"]
# TinyML runtimes
tinyml = [
    "onnxruntime>=1.16",
    "tflite-runtime>=2.14; platform_machine != 'armv7l'",
]
# QEMU (requires system binary)
qemu = []
# Dashboard
dashboard = [
    "streamlit>=1.30",
    "plotly>=5.18",
    "pandas>=2.0",
]
# Hardware-in-the-loop testing (pure stdlib today; reserved for future deps)
hil = []
# Full development environment
all = [
    "eaiv[dev]",
    "eaiv[jlink]",
    "eaiv[tinyml]",
    "eaiv[dashboard]",
    "eaiv[hil]",
]

[project.scripts]
eaiv = "eaiv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's defaults: the default
# rule set changes between releases, so an unpinned selection means CI can
# start failing on an unchanged codebase.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "PIE",  # misc lints
    "RUF",  # ruff-specific
    "S",    # bandit — subprocess, paths, and deserialization matter here
    "BLE",  # blind except
    "TRY",  # exception anti-patterns
]
extend-ignore = [
    "E501",    # line length is handled by black
    "ANN401",
    "TRY003",  # long messages in raise: the messages are the product here
    "TRY300",  # return-in-else reads worse than an early return
    "TRY400",  # log.error vs log.exception: chosen per call site
    "S101",    # assert is fine in tests (and in internal invariants)
    "SIM108",  # ternaries are not always clearer than if/else
    "B008",    # click decorators legitimately call functions in defaults
    # Seeded `random` is the point: fault injection and the simulated power
    # monitor must be reproducible, not unpredictable.
    "S311",
    # Every subprocess call in this package uses a fixed argv and no shell.
    # S602 (shell=True) stays enabled, which is the rule that matters.
    "S603",
    "S607",
    # ValueError is the documented contract for "this file is not a valid
    # report/config"; callers (and tests) catch ValueError, and TypeError
    # would be a breaking change for no benefit.
    "TRY004",
    # En dashes and non-breaking hyphens are deliberate in user-facing prose.
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# Tests exercise error paths, poke at private seams, and use fixtures that
# shadow their own names.
"tests/**" = ["S", "BLE", "TRY", "RUF018", "B011"]
# The Streamlit layer builds HTML from escaped values on purpose.
"src/eaiv/dashboard/ui/**" = ["S308"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "eaiv.plugins.sensors"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "eaiv.plugins.benchmarks"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pre-commit]
repos = [
    { repo = "https://github.com/astral-sh/ruff-pre-commit", rev = "v0.4.0" },
    { repo = "https://github.com/psf/black", rev = "24.0.0" },
]
hooks = [
    "ruff",
    "ruff-format",
    "black",
]
